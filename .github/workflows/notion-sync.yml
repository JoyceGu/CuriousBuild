name: Notion Blog Auto-Sync

on:
  schedule:
    # 每天 UTC 时间 02:00 (北京时间 10:00) 自动运行
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 允许手动触发

# 只负责同步 Notion 和翻译并提交到 main；网站由 Cloudflare Pages 在 main 有新提交时自动发布
permissions:
  contents: write  # 允许推送到仓库

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # 获取完整历史记录
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml markdown anthropic
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Sync from Notion
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: |
        cd blog
        python3 sync_notion.py

    - name: AI translate missing language versions
      # 用 Claude 订阅（CLAUDE_CODE_OAUTH_TOKEN，本地运行 `claude setup-token` 生成）
      # 或 Anthropic API（ANTHROPIC_API_KEY）；两个都没配置时跳过。翻译失败不影响其余文章发布
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BLOG_TRANSLATE_DIRECTION: both
      run: |
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          export BLOG_AI_BACKEND=api
        elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
          unset ANTHROPIC_API_KEY
          export BLOG_AI_BACKEND=claude-code
          npm install -g @anthropic-ai/claude-code
        else
          echo "No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret, skipping AI translation"
          exit 0
        fi
        python3 blog/scripts/ai_translate.py || echo "::warning::Some articles failed to translate, see log above"
        cd blog
        python3 build.py

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected:"
          git status --short
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
    
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git add .
        git commit -m "🔄 Auto-sync blog from Notion $(date '+%Y-%m-%d %H:%M:%S')"
        git push
    
    - name: Summary
      run: |
        if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
          echo "✅ Blog synchronized! Cloudflare Pages will deploy the new commit."
        else
          echo "📝 No changes found in Notion database"
        fi